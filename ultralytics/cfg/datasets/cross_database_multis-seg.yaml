# parent
# ├── ultralytics
# └── datasets
#     └── coco8-seg ← downloads here (1 MB)


## Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
#path: /home/chenkejing/database/AITotal_SegmentDatabase/wireDatabaseSegment # dataset root dir
#train: images/train # train images (relative to 'path') 4 images
#val: images/val # val images (relative to 'path') 4 images
#test: # test images (optional)
#
## Classes
#names:
#  0: wire

# ⭐ 全局类别（统一空间）
names:
  0: wire
  1: cable
  2: connector

multi_datasets:

  - name: wire_A
    weight: 1.0
    train: /home/chenkejing/database/AITotal_SegmentDatabase/wireDatabaseSegment/images/train
    val: /home/chenkejing/database/AITotal_SegmentDatabase/wireDatabaseSegment/images/val
    data:
      names:
        0: wire
        # ⭐ 映射（local → global）
        class_map:
          0: 0   # wire -> wire

  - name: wire_B
    weight: 5.0   # ⭐重点：小数据集提高权重
    train: /home/chenkejing/database/AITotal_SegmentDatabase/wireDatabaseSegment/images/train
    val: /home/chenkejing/database/AITotal_SegmentDatabase/wireDatabaseSegment/images/val
    data:
      names:
        0: cable

      class_map:
        0: 1   # cable -> global cable

